<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exos+ AI Orchestra</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background: #000;
      color: #fff;
      text-align: center;
      padding: 40px 20px;
    }
    .box {
      background: #111;
      border-radius: 12px;
      padding: 20px;
      margin: 0 auto 40px;
      max-width: 500px;
      text-align: left;
      font-size: 15px;
      line-height: 1.8;
    }
    h2 {
      font-size: 32px;
      margin-bottom: 8px;
    }
    h3 {
      font-size: 20px;
      font-weight: 400;
      color: #aaa;
      margin-bottom: 20px;
    }
    .price {
      font-size: 64px;
      font-weight: 700;
    }
    .price span {
      font-size: 20px;
      color: #aaa;
      font-weight: 400;
    }
    form {
      margin: 25px 0;
    }
    input[type="email"] {
      width: 100%;
      max-width: 300px;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #1a1a1a;
      color: #fff;
      font-size: 15px;
      margin-bottom: 12px;
    }
    button {
      width: 100%;
      max-width: 300px;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(90deg, #00d4ff, #3b82f6);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .success {
      color: #4ade80;
      font-size: 15px;
      margin-top: 10px;
    }
    .compare {
      color: #aaa;
      font-size: 14px;
      margin-top: 15px;
    }
    footer {
      margin-top: 60px;
      color: #555;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="box">
    market<br>
    <strong>GPT-5:</strong> Creates English copy<br>
    <strong>Claude 4:</strong> Translates to PT-BR<br>
    <strong>Grok 4:</strong> Adds trending X hashtags<br>
    <strong>Exos+ Final:</strong> Perfect ad ready to launch 🔥
  </div>

  <h2>Pricing</h2>
  <h3>Exos+ Pro</h3>
  <div class="price">$3 <span>Lifetime</span></div>

  <form action="https://formspree.io/f/mvzlyqvj" method="POST">
    <input type="email" name="email" placeholder="Masukkan email lo" required>
    <input type="hidden" name="_next" value="https://maisonlinore.github.io/exosplus.github.io/">
    <button type="submit">Join Waitlist</button>
  </form>

  <p class="success">Thanks! Check your Email 🚀</p>
  <p class="compare">vs $720/year for ChatGPT + Claude + Gemini</p>

  <footer>
    Exos+ AI Orchestra © 2026
  </footer>
</body>
</html>
